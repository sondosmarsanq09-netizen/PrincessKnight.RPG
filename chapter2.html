<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 2 - Palace Grounds</title>
  <link rel="stylesheet" href="chapter2.css">
</head>
<body id="game-body">
  <div id="transition-overlay" class="fade-overlay active"></div>

  <!-- UI Elements -->
  <div id="location-banner">📍 Dragon's Hall</div>
  <div id="objective">Objective: Tend to your duties in the hall.</div>

  <!-- Edge Navigation Indicators -->
  <div id="arrow-left" class="edge-indicator left">
    <span class="arrow-icon">◀</span>
    <span class="area-label">Forge Chambers</span>
  </div>

  <div id="arrow-right" class="edge-indicator right">
    <span class="area-label">Royal Garden</span>
    <span class="arrow-icon">▶</span>
  </div>

  <!-- Characters & Elements -->
  <div id="knight" class="facing-right"></div>
  <div id="princess" class="hidden"></div>

  <div id="dialogue-box" class="hidden">
    <div id="speaker-name">Knight</div>
    <p id="dialogue-text"></p>
    <button id="prev-arrow" class="nav-arrow" title="Previous Line">◀</button>
    <button id="next-arrow" class="nav-arrow" title="Next Line">▶</button>
  </div>

  <script src="chapter2.js"></script>
</body>
</html>
