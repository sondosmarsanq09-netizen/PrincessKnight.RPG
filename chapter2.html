<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 2 - Palace Grounds</title>
  <link rel="stylesheet" href="chapter2.css">
</head>
<body id="game-body">
  <div id="transition-overlay" class="fade-overlay active"></div>

  <!-- UI & Objectives -->
  <div id="location-banner">📍 Dragon's Hall</div>
  <div id="objective">Objective: Head to the Forge Chambers to inspect the anvil.</div>

  <!-- Edge Navigation Arrows -->
  <div id="arrow-left" class="edge-indicator left">
    <span class="arrow-icon">◀</span> Forge Chambers
  </div>
  <div id="arrow-right" class="edge-indicator right">
    Royal Garden <span class="arrow-icon">▶</span>
  </div>

  <!-- Interactive Action Prompt (Press E) -->
  <div id="interaction-prompt" class="interaction-prompt hidden">Press [E] to Interact</div>

  <!-- Lively Action Feedback Popup (pops out when you press E) -->
  <div id="action-popup" class="action-popup hidden"></div>

  <!-- Visual Task Marker -->
  <div id="task-marker" class="task-marker hidden">✨</div>

  <!-- Knight Element -->
  <div id="knight"></div>

  <script src="chapter2.js"></script>
</body>
</html>
