<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 3</title>
  <link rel="stylesheet" href="CH3.css" />
</head>
<body id="game-body">
  <div id="location-banner">📍 Midnight Hall</div>
  <div id="objective">Objective: Chapter 3 begins...</div>

  <div id="knight" class="facing-right"></div>

  <div id="princess" class="facing-left hidden">
    <div class="layer"></div>
  </div>

  <div id="task-marker" class="task-marker hidden">❗</div>
  <div id="interaction-prompt" class="interaction-prompt hidden"></div>
  <div id="action-popup" class="action-popup hidden"></div>
  <div id="arrow-right" class="nav-arrow hidden" style="position: fixed; right: 24px; top: 50%; transform: translateY(-50%); display: none;">&gt;</div>

  <div id="dialogue-box" class="dialogue-box hidden">
    <div id="dialogue-speaker" class="dialogue-speaker">Knight</div>
    <div id="dialogue-text" class="dialogue-text"></div>
    <div id="dialogue-choices" class="dialogue-choices hidden"></div>
    <div id="dialogue-hint" class="dialogue-hint"></div>
  </div>

  <div id="transition-overlay" class="fade-overlay"></div>

  <script src="CH3.js"></script>
</body>
</html>
