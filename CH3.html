<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CH3.css">
</head>
<body id="game-body">
  <!-- Pure Black Fade Transition Overlay -->
  <div id="transition-overlay" class="fade-overlay"></div>

  <!-- UI & Free-Roam Banner -->
  <div id="location-banner">📍 Princess's Chambers</div>
  <div id="objective">Free Roam: Walk around your room or head right to the Balcony.</div>

  <!-- Edge Navigation Indicator (Balcony to the right) -->
  <div id="arrow-right" class="edge-indicator right">
    <span class="area-label">Balcony</span>
    <span class="arrow-icon">▶</span>
  </div>

  <!-- Princess Sprite (Exact Chapter 2 Scene 2 Layer Structure) -->
  <div id="princess" class="facing-right">
    <div class="layer" style="background-image: url('Female%20Skin1.png');"></div>
    <div class="layer" style="background-image: url('Boots.png');"></div>
    <div class="layer" style="background-image: url('Skirt.png');"></div>
    <div class="layer" style="background-image: url('Corset%20v2.png');"></div>
    <div class="layer" style="background-image: url('Female%20Hair3.png');"></div>
  </div>

  <script src="CH3.js"></script>
</body>
</html>
