<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 4 - Flower Quest</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="CH4.css" />
</head>
<body id="game-body">
  <!-- Pure Black Fade Transition Overlay -->
  <div id="transition-overlay" class="fade-overlay active"></div>

  <!-- UI & Objectives -->
  <div id="location-banner">📍 Meadow Clearing</div>
  <div id="objective">Objective: Find a gift for your date — gather a full bouquet of flowers she loves.</div>

  <!-- Live Bouquet & Collected Flowers Tracker -->
  <div id="bouquet-hud" class="bouquet-hud">
    <div class="bouquet-header">
      <span id="bouquet-title">Bouquet: 0 / 5</span>
      <span id="bouquet-visual" class="bouquet-visual">🎀</span>
    </div>
    <div id="bouquet-flowers-list" class="bouquet-flowers-list"></div>
  </div>

  <!-- Spawned Ground Flowers Container -->
  <div id="flowers-layer"></div>

  <!-- Interactive Action Prompt -->
  <div id="interaction-prompt" class="interaction-prompt hidden">Press [E] to Pick Flower</div>

  <!-- Floating Emotion Popups Above Characters -->
  <div id="knight-emotion" class="emote-bubble hidden"></div>
  <div id="princess-emotion" class="emote-bubble hidden"></div>

  <!-- Knight Sprite (Controlled in Chapter 4) -->
  <div id="knight" class="facing-right"></div>

  <!-- Princess Sprite (Waiting by the Tree Facing Right) -->
  <div id="princess" class="facing-right hidden">
    <div class="layer" style="background-image: url('Female%20Skin1.png');"></div>
    <div class="layer" style="background-image: url('Boots.png');"></div>
    <div class="layer" style="background-image: url('Skirt.png');"></div>
    <div class="layer" style="background-image: url('Corset%20v2.png');"></div>
    <div class="layer" style="background-image: url('Female%20Hair3.png');"></div>
  </div>

  <!-- Chat Dialogue Box -->
  <div id="dialogue-box" class="dialogue-box hidden">
    <div id="dialogue-speaker" class="dialogue-speaker"></div>
    <div id="dialogue-text" class="dialogue-text"></div>
    <div id="dialogue-choices" class="dialogue-choices hidden"></div>
    <div id="dialogue-hint" class="dialogue-hint">Press [E] / [Space] or &gt; to continue</div>
  </div>

  <script src="CH4.js"></script>
</body>
</html>
