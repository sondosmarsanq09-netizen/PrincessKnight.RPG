<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 2 - Scene 3: The Royal Garden</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chapter2scene3.css">
</head>
<body id="game-body">
  <!-- Pure Black Fade Transition Overlay -->
  <div id="transition-overlay" class="fade-overlay active"></div>

  <!-- Shared Audio Mute Button -->
  <button id="audio-toggle" class="audio-btn" type="button" title="Toggle Sound">🔊 Sound: ON</button>

  <!-- UI & Objectives -->
  <div id="location-banner">📍 Royal Garden</div>
  <div id="objective">Objective: Investigate the strange noise near the fountain.</div>

  <!-- Interactive Action Prompt -->
  <div id="interaction-prompt" class="interaction-prompt hidden">Press [E] to Interact</div>

  <!-- Floating Emotion & Reaction Popups Above Characters -->
  <div id="knight-emotion" class="emotion-badge hidden"></div>
  <div id="princess-emotion" class="emotion-badge hidden"></div>
  <div id="action-popup" class="action-popup hidden"></div>

  <!-- Visual Task Marker -->
  <div id="task-marker" class="task-marker hidden">✨</div>

  <!-- Knight Sprite (Exact Chapter 2 Scene 1 Setup) -->
  <div id="knight" class="facing-right"></div>

  <!-- Princess Sprite (Autonomous NPC in Scene 3) -->
  <div id="princess" class="facing-left hidden">
    <div class="layer" style="background-image: url('Female%20Skin1.png');"></div>
    <div class="layer" style="background-image: url('Boots.png');"></div>
    <div class="layer" style="background-image: url('Skirt.png');"></div>
    <div class="layer" style="background-image: url('Corset%20v2.png');"></div>
    <div class="layer" style="background-image: url('Female%20Hair3.png');"></div>
  </div>

  <!-- Upgraded Dialogue & Inner Monologue Box -->
  <div id="dialogue-box" class="dialogue-box hidden">
    <div id="dialogue-speaker" class="dialogue-speaker"></div>
    <div id="dialogue-text" class="dialogue-text"></div>
    <div id="dialogue-choices" class="dialogue-choices"></div>
    <div id="dialogue-hint" class="dialogue-hint">Press [E] or [Space] to continue</div>
  </div>

  <script src="game-audio.js"></script>
  <script src="chapter2scene3.js"></script>
</body>
</html>
